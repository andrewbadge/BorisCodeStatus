name: Release

# Publishes a GitHub Release with the MSI attached. Run manually from the Actions tab:
# Actions -> Release -> "Run workflow".
#
# Releasing is deliberately a manual, deliberate act rather than something a tag push triggers as
# a side effect.
#
# The version is NOT an input. It is read from <Version> in Directory.Build.props, which is the
# same value stamped onto every assembly and shown in the tray menu. Typing a version here instead
# let the published release disagree with what the installed app reports about itself. To release
# a new version, raise <Version> in Directory.Build.props, merge that, then run this workflow.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        required: false
        default: false
      force:
        description: 'Release even if this version is not higher than the latest existing release'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  release:
    # Windows is not a preference: the tray targets net10.0-windows and WiX only runs on Windows.
    runs-on: windows-latest

    permissions:
      contents: write # Create the tag and the release.

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to see existing tags for the ordering check below.

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Pinned to 4.0.5: WiX v7 refuses to run without accepting the Open Source Maintenance Fee
      # EULA, which is a licensing decision rather than a technical one.
      - name: Install WiX v4
        run: dotnet tool install --global wix --version 4.0.5

      - name: Read version from Directory.Build.props
        id: version
        shell: pwsh
        run: |
          # The single source of truth: this same value is stamped onto every assembly and is what
          # the tray menu displays, so a release can never claim a version the app disagrees with.
          $props = 'Directory.Build.props'
          $raw = ([xml](Get-Content $props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1

          if (-not $raw) {
            Write-Error "No <Version> found in $props. That file is the source of truth for the release version."
            exit 1
          }

          $version = "$raw".Trim()
          Write-Host "Version from ${props}: $version"

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "'$version' in $props is not usable. Use major.minor.build, e.g. 1.1.0. An MSI ProductVersion cannot carry a suffix such as -rc1."
            exit 1
          }

          # Each MSI field is a 16-bit number; larger values are silently truncated by Windows,
          # which would produce a package that upgrades unpredictably.
          foreach ($part in $version.Split('.')) {
            if ([int]$part -gt 65535) {
              Write-Error "Version part '$part' exceeds 65535, which an MSI cannot represent."
              exit 1
            }
          }

          $tag = "v$version"

          if (git tag --list $tag) {
            Write-Error "Tag $tag already exists. Raise <Version> in Directory.Build.props, or delete the existing tag and release first."
            exit 1
          }

          # MajorUpgrade will not replace an installed copy unless the version increases, so a
          # release that goes backwards would install but never supersede anything.
          $existing = git tag --list 'v*' |
            ForEach-Object { $_ -replace '^v', '' } |
            Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
            ForEach-Object { [version]$_ } |
            Sort-Object -Descending |
            Select-Object -First 1

          if ($existing) {
            Write-Host "Latest existing release: v$existing"
            if ([version]$version -le $existing) {
              if ('${{ github.event.inputs.force }}' -ne 'true') {
                Write-Error "Version $version is not higher than the latest release ($existing). Installed copies would not upgrade. Raise <Version> in Directory.Build.props, or re-run with 'force' if this is deliberate."
                exit 1
              }
              Write-Warning "Version $version is not higher than $existing, continuing because force was set."
            }
          } else {
            Write-Host "No previous release found; this is the first."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag"

      - name: Restore
        run: dotnet restore

      # The release build runs the tests too. They are quick, and shipping an MSI built from code
      # that fails its own tests is not a trade worth making for a minute of runtime.
      - name: Test
        run: dotnet test FidoRelay.Core.Tests -c Release --no-restore

      # No -p:Version override: the build takes it from Directory.Build.props like every other
      # build does. The verification below then checks that file all the way through to the MSI,
      # rather than checking the workflow against a value the workflow itself supplied.
      - name: Build MSI
        run: dotnet build -c Release --no-restore

      - name: Verify the MSI looks right
        shell: pwsh
        run: |
          # Guard against shipping a package that built but is wrong. Cheap compared to publishing
          # a broken installer under a permanent version number.
          $msi = "FidoRelay.Installer\bin\Release\FidoRelay.msi"
          if (-not (Test-Path $msi)) { throw "MSI was not produced at $msi" }

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember("OpenDatabase","InvokeMethod",$null,$installer,@((Resolve-Path $msi).Path, 0))

          function Invoke-MsiQuery($sql, $columns) {
            $view = $db.GetType().InvokeMember("OpenView","InvokeMethod",$null,$db,@($sql))
            $view.GetType().InvokeMember("Execute","InvokeMethod",$null,$view,$null)
            $rows = @()
            while ($true) {
              $record = $view.GetType().InvokeMember("Fetch","InvokeMethod",$null,$view,$null)
              if ($null -eq $record) { break }
              $values = @()
              for ($c = 1; $c -le $columns; $c++) {
                $values += $record.GetType().InvokeMember("StringData","GetProperty",$null,$record,@($c))
              }
              $rows += ,($values -join '|')
            }
            $rows
          }

          $expected = '${{ steps.version.outputs.version }}'
          $properties = Invoke-MsiQuery "SELECT ``Property``, ``Value`` FROM ``Property``" 2
          $actual = ($properties | Where-Object { $_ -like 'ProductVersion|*' }) -replace '^ProductVersion\|', ''
          if ($actual -ne $expected) { throw "MSI ProductVersion is '$actual', expected '$expected'" }

          $files = Invoke-MsiQuery "SELECT ``FileName`` FROM ``File``" 1
          foreach ($required in @('FidoRelay.Tray.exe', 'FidoRelay.Hooks.exe')) {
            if (-not ($files | Where-Object { $_ -like "*$required" })) { throw "$required is missing from the MSI" }
          }

          # A per-user install must not set ALLUSERS; if it ever does, the package starts demanding
          # elevation and the whole no-admin design is quietly broken.
          if ($properties | Where-Object { $_ -like 'ALLUSERS|*' }) {
            throw "ALLUSERS is set - the package would require administrator rights"
          }

          Write-Host "MSI verified: version $actual, $($files.Count) files, per-user scope"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'

          # Name the asset after the version so downloads stay distinguishable once saved.
          $asset = "FidoRelay-$version.msi"
          Copy-Item "FidoRelay.Installer\bin\Release\FidoRelay.msi" $asset

          # Built as an array rather than a here-string: PowerShell treats a backtick as an escape
          # character, so markdown code spans inside a here-string would be silently mangled.
          # Written to a file and passed with --notes-file to avoid multi-line argument quoting.
          $notes = @(
            'Per-user Windows installer for the FidoRelay.',
            '',
            "**Install:** run $asset. No administrator rights are required - it installs under",
            'your local app data, starts at login via an HKCU Run key, and registers its Claude Code',
            'hooks on first launch.',
            '',
            '**After installing,** Windows will ask whether to allow the relay through the firewall.',
            'Choose **Allow access**. Without it your ESP32 display can never reach the endpoint, even',
            'though everything looks fine on the PC itself. If you are not an administrator, use',
            '**Fix firewall access** in the tray menu to get the exact command to send to whoever is.',
            '',
            'See the README for the /status schema, and note that the endpoint is unauthenticated.'
          )
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          # gh creates the tag at the checked-out commit, so there is no separate tag push to get
          # out of step with the release.
          $arguments = @($tag, $asset, '--title', $tag, '--notes-file', 'release-notes.md', '--target', $env:GITHUB_SHA)
          if ('${{ github.event.inputs.prerelease }}' -eq 'true') { $arguments += '--prerelease' }

          gh release create @arguments

          "### Released $tag" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Asset: $asset" >> $env:GITHUB_STEP_SUMMARY
