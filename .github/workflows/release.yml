name: Release

# Publishes a GitHub Release with the downloads attached. Run manually from the Actions tab:
# Actions -> Release -> "Run workflow".
#
# Releasing is deliberately a manual, deliberate act rather than something a tag push triggers as
# a side effect.
#
# The version is NOT an input. It is read from <Version> in Directory.Build.props, which is the
# same value stamped onto every assembly and shown in the tray menu. Typing a version here instead
# let the published release disagree with what the installed app reports about itself. To release
# a new version, raise <Version> in Directory.Build.props, merge that, then run this workflow.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        required: false
        default: false
      force:
        description: 'Release even if this version is not higher than the latest existing release'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One run, one release: each platform builds and verifies its own download, and publish attaches
# them all to a single tag only after every platform job has passed, so a release can never carry
# one build without the other.
#
#   version ─┬─ windows ─┬─ publish
#            └─ macos  ──┘
#
# The macos job needs six repository secrets (Settings -> Secrets and variables -> Actions), and
# fails in its first step, before building anything, if any is missing:
#   MACOS_CERTIFICATE_P12       the Developer ID Application certificate and its key, exported as
#                               .p12 and base64-encoded (base64 -i cert.p12 | pbcopy)
#   MACOS_CERTIFICATE_PASSWORD  the password the .p12 was exported with
#   MACOS_TEAM_ID               the ten-character Apple Developer team ID
#   MACOS_NOTARY_KEY_P8         an App Store Connect API key (the .p8 file's text), used to notarise
#   MACOS_NOTARY_KEY_ID         that key's ID
#   MACOS_NOTARY_ISSUER_ID      the issuer ID shown above the keys in App Store Connect
jobs:
  version:
    # Decides the version and checks the tag before anything is built, so a bad version fails in
    # seconds rather than after both builds.
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Needed to see existing tags for the ordering check below.

      - name: Read version from Directory.Build.props
        id: version
        shell: pwsh
        run: |
          # The single source of truth: this same value is stamped onto every assembly and is what
          # the tray menu displays, so a release can never claim a version the app disagrees with.
          $props = 'Directory.Build.props'
          $raw = ([xml](Get-Content $props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1

          if (-not $raw) {
            Write-Error "No <Version> found in $props. That file is the source of truth for the release version."
            exit 1
          }

          $version = "$raw".Trim()
          Write-Host "Version from ${props}: $version"

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "'$version' in $props is not usable. Use major.minor.build, e.g. 1.1.0. An MSI ProductVersion cannot carry a suffix such as -rc1."
            exit 1
          }

          # Each MSI field is a 16-bit number; larger values are silently truncated by Windows,
          # which would produce a package that upgrades unpredictably.
          foreach ($part in $version.Split('.')) {
            if ([int]$part -gt 65535) {
              Write-Error "Version part '$part' exceeds 65535, which an MSI cannot represent."
              exit 1
            }
          }

          $tag = "v$version"

          if (git tag --list $tag) {
            Write-Error "Tag $tag already exists. Raise <Version> in Directory.Build.props, or delete the existing tag and release first."
            exit 1
          }

          # MajorUpgrade will not replace an installed copy unless the version increases, so a
          # release that goes backwards would install but never supersede anything.
          $existing = git tag --list 'v*' |
            ForEach-Object { $_ -replace '^v', '' } |
            Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
            ForEach-Object { [version]$_ } |
            Sort-Object -Descending |
            Select-Object -First 1

          if ($existing) {
            Write-Host "Latest existing release: v$existing"
            if ([version]$version -le $existing) {
              if ('${{ github.event.inputs.force }}' -ne 'true') {
                Write-Error "Version $version is not higher than the latest release ($existing). Installed copies would not upgrade. Raise <Version> in Directory.Build.props, or re-run with 'force' if this is deliberate."
                exit 1
              }
              Write-Warning "Version $version is not higher than $existing, continuing because force was set."
            }
          } else {
            Write-Host "No previous release found; this is the first."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag"

  windows:
    needs: version

    # Windows is not a preference: the tray targets net10.0-windows and WiX only runs on Windows.
    runs-on: windows-latest

    # The .NET solution lives in windows/; Directory.Build.props, the version for both builds, stays
    # at the repo root, where MSBuild finds it by walking up.
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Pinned to 4.0.5: WiX v7 refuses to run without accepting the Open Source Maintenance Fee
      # EULA, which is a licensing decision rather than a technical one.
      - name: Install WiX v4
        run: dotnet tool install --global wix --version 4.0.5

      - name: Restore
        run: dotnet restore

      # The release build runs the tests too. They are quick, and shipping an MSI built from code
      # that fails its own tests is not a trade worth making for a minute of runtime.
      - name: Test
        run: dotnet test BorisCodeStatus.Core.Tests -c Release --no-restore

      # No -p:Version override: the build takes it from Directory.Build.props like every other
      # build does. The verification below then checks that file all the way through to the MSI,
      # rather than checking the workflow against a value the workflow itself supplied.
      - name: Build MSI
        run: dotnet build -c Release --no-restore

      - name: Verify the MSI looks right
        shell: pwsh
        run: |
          # Guard against shipping a package that built but is wrong. Cheap compared to publishing
          # a broken installer under a permanent version number.
          $msi = "BorisCodeStatus.Installer\bin\Release\BorisCodeStatus.msi"
          if (-not (Test-Path $msi)) { throw "MSI was not produced at $msi" }

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember("OpenDatabase","InvokeMethod",$null,$installer,@((Resolve-Path $msi).Path, 0))

          function Invoke-MsiQuery($sql, $columns) {
            $view = $db.GetType().InvokeMember("OpenView","InvokeMethod",$null,$db,@($sql))
            $view.GetType().InvokeMember("Execute","InvokeMethod",$null,$view,$null)
            $rows = @()
            while ($true) {
              $record = $view.GetType().InvokeMember("Fetch","InvokeMethod",$null,$view,$null)
              if ($null -eq $record) { break }
              $values = @()
              for ($c = 1; $c -le $columns; $c++) {
                $values += $record.GetType().InvokeMember("StringData","GetProperty",$null,$record,@($c))
              }
              $rows += ,($values -join '|')
            }
            $rows
          }

          $expected = '${{ needs.version.outputs.version }}'
          $properties = Invoke-MsiQuery "SELECT ``Property``, ``Value`` FROM ``Property``" 2
          $actual = ($properties | Where-Object { $_ -like 'ProductVersion|*' }) -replace '^ProductVersion\|', ''
          if ($actual -ne $expected) { throw "MSI ProductVersion is '$actual', expected '$expected'" }

          $files = Invoke-MsiQuery "SELECT ``FileName`` FROM ``File``" 1
          foreach ($required in @('BorisCodeStatus.Tray.exe', 'BorisCodeStatus.Hooks.exe')) {
            if (-not ($files | Where-Object { $_ -like "*$required" })) { throw "$required is missing from the MSI" }
          }

          # A per-user install must not set ALLUSERS; if it ever does, the package starts demanding
          # elevation and the whole no-admin design is quietly broken.
          if ($properties | Where-Object { $_ -like 'ALLUSERS|*' }) {
            throw "ALLUSERS is set - the package would require administrator rights"
          }

          Write-Host "MSI verified: version $actual, $($files.Count) files, per-user scope"

      # Named after the version so downloads stay distinguishable once saved.
      - name: Name the MSI for the release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item "BorisCodeStatus.Installer\bin\Release\BorisCodeStatus.msi" "upload\BorisCodeStatus-${{ needs.version.outputs.version }}.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows/upload/
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15

    defaults:
      run:
        working-directory: macos

    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
      MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

    steps:
      # First, so a release without the credentials fails in seconds rather than after a build.
      - name: Check the signing secrets are set
        run: |
          missing=""
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_TEAM_ID MACOS_NOTARY_KEY_P8 MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See the header of release.yml."
            exit 1
          fi

      - uses: actions/checkout@v7

      # swift-testing's macros need Xcode, not the Command Line Tools.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer && swift --version

      - name: Test
        run: swift test

      # A throwaway keychain, so the certificate never touches the runner's login keychain and is
      # gone with the runner. Its password is random because nothing but this job ever unlocks it.
      - name: Import the Developer ID certificate
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

          # By hash rather than by name, so only the certificate for this team can match, however
          # many identities the keychain ends up holding.
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application: .*($MACOS_TEAM_ID)" | head -n 1 | awk '{print $2}')
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity for team $MACOS_TEAM_ID in the certificate."
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and sign the app bundle
        run: scripts/build-app.sh

      - name: Verify the bundle looks right
        run: |
          app=.build/BorisCodeStatus.app
          expected='${{ needs.version.outputs.version }}'
          test -x "$app/Contents/MacOS/BorisCodeStatus"
          test -x "$app/Contents/Helpers/BorisCodeStatusHooks"
          test "$(ls "$app/Contents/Resources/Sounds"/*.wav | wc -l)" -eq "$(ls ../shared/sounds/*.wav | wc -l)"
          actual=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          if [ "$actual" != "$expected" ]; then echo "::error::Bundle version is $actual, expected $expected"; exit 1; fi
          archs=$(lipo -archs "$app/Contents/MacOS/BorisCodeStatus")
          case " $archs " in *" arm64 "*) ;; *) echo "::error::arm64 missing: $archs"; exit 1 ;; esac
          case " $archs " in *" x86_64 "*) ;; *) echo "::error::x86_64 missing: $archs"; exit 1 ;; esac
          codesign --verify --deep --strict "$app"

          # Notarisation rejects anything without the hardened runtime, or signed by another team;
          # better to learn that here than from Apple's log.
          for binary in "$app" "$app/Contents/Helpers/BorisCodeStatusHooks"; do
            details=$(codesign -dv --verbose=4 "$binary" 2>&1)
            echo "$details" | grep -q "^TeamIdentifier=$MACOS_TEAM_ID$" || { echo "::error::$binary is not signed by team $MACOS_TEAM_ID"; exit 1; }
            echo "$details" | grep -q "flags=.*runtime" || { echo "::error::$binary lacks the hardened runtime"; exit 1; }
          done
          echo "Bundle verified: version $actual, universal, Developer ID signed with the hardened runtime"

      # The .dmg is signed as well as the app inside it, so Gatekeeper can check the download
      # itself; then notarised with the API key (not an Apple ID and app-specific password) and
      # stapled, so it opens without a network check on first launch.
      - name: Package, sign, notarise and staple the .dmg
        run: |
          scripts/package-dmg.sh
          dmg=".build/BorisCodeStatus-${{ needs.version.outputs.version }}-macOS.dmg"
          test -f "$dmg"
          codesign --force --sign "$SIGN_IDENTITY" --timestamp "$dmg"

          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$MACOS_NOTARY_KEY_P8" > "$key"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          rm "$key"
          cat "$RUNNER_TEMP/notary.json"

          status=$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || echo unknown)
          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarisation status: $status. 'xcrun notarytool log <id>' with the same key shows why."
            exit 1
          fi

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg"

          mkdir -p upload
          cp "$dmg" upload/

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: macos/upload/
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  publish:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest

    permissions:
      contents: write # Create the tag and the release.

    steps:
      # Checked out only so gh has a repository to work in; nothing is built here.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $tag = '${{ needs.version.outputs.tag }}'

          # Every platform job uploads its download already named for the release; each one found
          # here is attached. Both are required: the Mac update check announces only a release that
          # carries the .dmg.
          $assets = @(Get-ChildItem downloads -File | ForEach-Object { $_.FullName })
          $msi = "BorisCodeStatus-$version.msi"
          $dmg = "BorisCodeStatus-$version-macOS.dmg"
          foreach ($required in @($msi, $dmg)) {
            if (-not ($assets | Where-Object { (Split-Path $_ -Leaf) -eq $required })) { throw "$required was not downloaded" }
          }

          # Built as an array rather than a here-string: PowerShell treats a backtick as an escape
          # character, so markdown code spans inside a here-string would be silently mangled.
          # Written to a file and passed with --notes-file to avoid multi-line argument quoting.
          $notes = @(
            '## Windows',
            '',
            "**Install:** run $msi, the per-user installer. No administrator rights are required - it installs under",
            'your local app data, starts at login via an HKCU Run key, and registers its Claude Code',
            'hooks on first launch.',
            '',
            '**The HTTP service is off by default.** To serve /status to your ESP32 display, right-click',
            'the tray icon and choose **Settings > Enable HTTP service**. Windows will then ask whether to',
            'allow the relay through the firewall: choose **Allow access**. Without it the display can never',
            'reach the endpoint, even though everything looks fine on the PC itself. If you are not an',
            'administrator, use **Advanced > Fix firewall access** in the tray menu to get the exact command',
            'to send to whoever is.',
            '',
            'See docs/status-endpoint.md for the /status schema, and note that the endpoint is unauthenticated.',
            '',
            '## macOS',
            '',
            "**Install:** open $dmg and drag BorisCodeStatus to Applications. It needs macOS 14 or later and",
            'runs natively on Apple silicon and Intel. Signed with a Developer ID and notarised by Apple. Its',
            'first launch registers its Claude Code hooks and adds it to your login items; it lives in the',
            'menu bar, with no Dock icon.',
            '',
            '**Before deleting the app,** use **Settings > Advanced > Unregister hooks**, so that',
            '~/.claude/settings.json is not left pointing at a missing helper.',
            '',
            'Free software under the GNU GPL v3 or later; the source for this release is the tagged',
            'commit. An unofficial community project, not affiliated with Anthropic.'
          )
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          # gh creates the tag at the checked-out commit, so there is no separate tag push to get
          # out of step with the release.
          $arguments = @($tag) + $assets + @('--title', $tag, '--notes-file', 'release-notes.md', '--target', $env:GITHUB_SHA)
          if ('${{ github.event.inputs.prerelease }}' -eq 'true') { $arguments += '--prerelease' }

          gh release create @arguments

          "### Released $tag" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          foreach ($file in $assets) { "- $(Split-Path $file -Leaf)" >> $env:GITHUB_STEP_SUMMARY }
